name: 06 - Context Example
run-name: 06 - Context Example | DEBUG ${{ inputs.debug }}

on: 
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false

env:
    MY_WORKFLOW_VAR: 'workflow'
    MY_OVERWRITTEN_VAR: 'overwritten workflow'

jobs:
    echo:
        runs-on: ubuntu-latest
        env:
            MY_JOB_VAR: 'job'
            MY_OVERWRITTEN_VAR: 'overwritten job'
        steps:
            - name: Display Information
              run: |
                echo "Event name ${{ github.event_name }}"
                echo "Ref ${{ github.ref }}"
                echo "SHA ${{ github.sha }}"
                echo "Actor ${{ github.actor }}"
                echo "Workflow ${{ github.workflow }}"
                echo "Run ID ${{ github.run_id }}"
                echo "Run Number ${{ github.run_number }}"
            - name: Retrieve Variable
              run: |
                echo "Variable value: ${{ vars.MY_VAR }}"
            - name: Print Env Variables
              run: |
                echo "Workflow env: ${{ env.MY_WORKFLOW_VAR }}"
                echo "Workflow overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"
            - name: Print Job Env Variables
              env:
                MY_OVERWRITTEN_VAR: 'overwritten step'
              run: |
                echo "Workflow env: ${{ env.MY_WORKFLOW_VAR }}"
                echo "Workflow overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"
