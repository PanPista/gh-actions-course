name: 19 - 1 - Managing Concurrency

on:
    workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping URL
        id: ping-url
        uses: ./.github/actions/docker-ping-url
        with:
            url: https://www.invalidurlexamplecantbexisted.com
            max_retries: 10
            delay: 5