name: 07 - Expressions Example
run-name: 07 - Expressions Example | DEBUG - ${{ inputs.debug && 'ON' || 'OFF' }}

on: 
    push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false

jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: "[debug] Print start-up"
              if: ${{ inputs.debug }}
              run: |
                echo "Triggered by: ${{ github.event_name }}"
                echo "Branch ${{ github.ref }}"
            - name: "[debug] Print when triggering from main"
              if: ${{ inputs.debug && github.ref == 'refs/heads/main' }}
              run: |
                echo "This workflow was triggered from the main branch."
            - name: Greeting
              run: echo "Hello, world!"
            