name: 16 - Environments

on:
    workflow_dispatch:

jobs:
    echo-staging:
        runs-on: ubuntu-latest
        environment: staging
        env:
            my_env_value: ${{ vars.MY_ENV_VALUE || 'default_value' }}
        steps:
          - name: Print target environment
            run: |
              echo "Deploying to ${{ env.my_env_value }}"
    echo-tests:
        runs-on: ubuntu-latest
        needs: echo-staging
        steps:
          - name: E2E Tests
            run: echo "Running E2E tests"
    echo-prod:
        runs-on: ubuntu-latest
        needs: echo-tests
        environment: prod
        env:
            my_env_value: ${{ vars.MY_ENV_VALUE || 'default_value' }}
        steps:
          - name: Print target environment
            run: |
              echo "Deploying to ${{ env.my_env_value }}"


