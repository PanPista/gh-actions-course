name: 17 - 2 - Custom Actions JS Example
run-name: 17 - 2 - Custom Actions JS Example | BB - ${{ inputs.base-branch }} TB - ${{ inputs.target-branch }} WD - ${{ inputs.working-directory }}

on:
    workflow_dispatch:
        inputs:
            base-branch:
                type: string
                default: main
            target-branch:
                type: string
                default: update-deps
            working-directory:
                type: string
                default: 17-custom-actions/react-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for dependencies update
        uses: ./.github/actions/js_dependency-update
        with:
            base-branch: ${{ inputs.base-branch }}
            target-branch: ${{ inputs.target-branch }}
            working-directory: ${{ inputs.working-directory }}