name: 17 - 2 - Custom Actions JS Example
run-name: 17 - 2 - Custom Actions JS Example | BB - ${{ inputs.base-branch }} HB - ${{ inputs.head-branch }} WD - ${{ inputs.working-directory }}

on:
    workflow_dispatch:
        inputs:
            base-branch:
                type: string
                default: main
            head-branch:
                type: string
                default: update-deps
            working-directory:
                type: string
                default: 17-custom-actions/react-app
            debug:
                type: boolean
                default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for dependencies update
        uses: ./.github/actions/js_dependency-update
        with:
            base-branch: ${{ inputs.base-branch }}
            head-branch: ${{ inputs.head-branch }}
            working-directory: ${{ inputs.working-directory }}
            gh-token: ${{ secrets.GITHUB_TOKEN }}
            debug: ${{ inputs.debug }}