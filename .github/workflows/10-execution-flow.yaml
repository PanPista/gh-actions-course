name: 10 - Controlling the execution flow

on:
    workflow_dispatch:
        inputs:
            pass-unit-tests:
                type: boolean
                description: 'Whether to pass unit tests'
                default: true

jobs:
    lint-build:
        runs-on: ubuntu-latest
        steps:
            - name: Lint and Build
              run: echo "Linting and building"
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: Run Unit Tests
              run: echo "Running unit tests"
            - name: Failing unit tests
              if: ${{ !github.event.inputs.pass-unit-tests }}
              run: exit 1
    deploy-nonprod:
        runs-on: ubuntu-latest
        needs:
            - lint-build
            - unit-test
        steps:
            - name: Deploy to Non-Prod
              run: echo "Deploying to non-prod"
    e2e-tests:
        runs-on: ubuntu-latest
        needs:
            - deploy-nonprod
        steps:
            - name: Run E2E Tests
              run: echo "Running E2E tests"
    deploy-prod:
        runs-on: ubuntu-latest
        needs:
            - e2e-tests
        steps:
            - name: Deploy to Prod
              run: echo "Deploying to prod"
            