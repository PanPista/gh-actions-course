name: 11 - Using Inputs

on:
    workflow_dispatch:
        inputs:
            dry-run:
                type: boolean
                description: 'Whether to perform a dry run'
                default: false
            target:
                type: environment
                required: true
                description: 'Target environment'
            tag:
                type: choice
                options:
                  - v1
                  - v2
                  - v3
                default: v3
                description: 'Tag for the deployment'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Build
              run: echo "Building project from tag ${{ inputs.tag }}"
    deploy:
        runs-on: ubuntu-latest
        if: ${{ !inputs.dry-run }}
        environment: ${{ inputs.target }}
        needs: build
        steps:
            - name: Deploy
              run: echo "Deploying to ${{ inputs.target }} with tag ${{ inputs.tag }}"
