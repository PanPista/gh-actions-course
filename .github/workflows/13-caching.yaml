name: 13 - Caching

on:
    workflow_dispatch:
        inputs:
            use-cache:
                description: Whether to use cache
                type: boolean
                default: true
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 04-using-actions/react-app
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: '20.x'
            - name: Install dependencies
              run: npm ci
            - name: Testing
              run: npm run test
            - name: Build
              run: npm run build
            - name: Deploying to nonproduction environment
              run: echo "Deploying to nonproduction environment"
