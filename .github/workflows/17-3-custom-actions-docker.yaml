name: 17 - 3 - Custom Actions Docker Example

on:
    workflow_dispatch:
        inputs:
            url:
                type: choice
                options:
                  - 'https://google.com'
                  - 'https://exampleinvalidcccccyyfdddd.com'
                  - 'ddddddffd-vvvv'
            max_retries:
                type: string
                default: '10'
            delay:
                type: string
                default: '5'

jobs:
  ping-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping URL
        id: ping-url
        uses: ./.github/actions/docker-ping-url
        with:
            url: ${{ inputs.url }}
            max_retries: ${{ inputs.max_retries }}
            delay: ${{ inputs.delay }}
      - name: Print output
        run: |
         echo "URL reachable: ${{ steps.ping-url.outputs.url_reachable }}"