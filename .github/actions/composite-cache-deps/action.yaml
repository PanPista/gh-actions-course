name: Cache Node and NPM Dependencies
description: Caches Node.js and NPM dependencies to speed up workflow runs.

inputs:
  node-version:
    description: 'Node.js version to use'
    required: true
    default: 20.x 
  working-directory:
    description: 'Working directory for the cache'
    required: false
    default: .

runs:
  using: "composite"
  steps:
    - name: Setup Node.js version ${{ inputs.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}
    - name: Cache Node modules
      id: cache
      uses: actions/cache@v3
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: node-modules-${{ hashFiles(format('{0}/{1}', inputs.working-directory, 'package-lock.json')) }}
    - name: Install NPM dependencies
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: npm ci
      working-directory: ${{ inputs.working-directory }}
    